[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-container-monitor"
version = "0.1.0"
description = "Watch the server and Docker containers behind a Django project: checks every few minutes, ok / warning / danger, alerts, container logs in the admin, a status endpoint."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "silgena" }]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
]
dependencies = ["Django>=5.2"]

[project.optional-dependencies]
# Background runs on Django 5.2; Django 6.0+ has django.tasks built in.
tasks = ["django-tasks>=0.8"]

[project.urls]
Homepage = "https://github.com/silgena/django-container-monitor"
Source = "https://github.com/silgena/django-container-monitor"
Issues = "https://github.com/silgena/django-container-monitor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
container_monitor = ["templates/**/*.html"]
